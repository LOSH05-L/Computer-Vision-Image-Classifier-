<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Vision | CV Classifier Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #030712;
            color: #f3f4f6;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.1);
        }
        .neon-glow {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">

    <!-- Header -->
    <div class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-extrabold text-blue-400 neon-glow tracking-wider">NEURAL VISION PIPELINE</h1>
        <p class="text-gray-400 text-sm mt-2">PyTorch CNN • OpenCV • Cloud Inference Engine</p>
    </div>

    <!-- Main Container -->
    <div class="glass-card w-full max-w-md p-6 rounded-2xl shadow-2xl">
        
        <!-- Upload Area -->
        <div class="mb-6">
            <label class="block text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Select Target Image</label>
            <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
        </div>

        <!-- Image Preview -->
        <div id="previewContainer" class="hidden mb-6 flex justify-center">
            <img id="imagePreview" src="#" alt="Preview" class="max-h-48 rounded-lg border border-blue-500/30 object-contain shadow-md">
        </div>

        <!-- Action Button -->
        <button onclick="runInference()" id="inferBtn" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg hover:from-blue-500 hover:to-cyan-400 transition-all duration-200 active:scale-98">
            Run Neural Inference
        </button>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center mt-4 text-blue-400 text-sm animate-pulse">
            Processing through neural network layers...
        </div>

        <!-- Result Box -->
        <div id="resultBox" class="hidden mt-6 p-4 rounded-xl bg-gray-900/80 border border-blue-500/40 text-center">
            <p class="text-xs text-gray-400 uppercase tracking-widest">Classification Result</p>
            <p id="predClass" class="text-xl font-bold text-cyan-400 mt-1"></p>
            <p id="predConfidence" class="text-sm text-gray-300 mt-1"></p>
        </div>

    </div>

    <script>
        const API_URL = "https://computer-vision-image-classifier.onrender.com/predict";

        // Preview image before upload
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    document.getElementById('previewContainer').classList.remove('hidden');
                    document.getElementById('resultBox').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        async function runInference() {
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) {
                alert("Please select an image file first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            const inferBtn = document.getElementById('inferBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');

            inferBtn.disabled = true;
            loading.classList.remove('hidden');
            resultBox.classList.add('hidden');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Inference failed on server.");

                const data = await response.json();
                
                document.getElementById('predClass').innerText = data.prediction;
                document.getElementById('predConfidence').innerText = `Confidence Score: ${data.confidence}`;
                resultBox.classList.remove('hidden');
            } catch (error) {
                alert("Error connecting to backend API: " + error.message);
            } finally {
                inferBtn.disabled = false;
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
